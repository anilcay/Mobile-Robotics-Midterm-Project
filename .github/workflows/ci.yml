name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          path: src/repo

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro "$ROS_DISTRO"
          rosdep install --from-paths src --ignore-src --rosdistro "$ROS_DISTRO" -y
          apt-get install -y --no-install-recommends liburdfdom-tools

      - name: Build
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Check robot description
        run: |
          source install/setup.bash
          xacro "$(ros2 pkg prefix --share serabot_description)/urdf/serabot.urdf.xacro" > serabot.urdf
          check_urdf serabot.urdf

      # Linter tests skip themselves when ament_flake8 is missing (for local
      # Windows runs), so make sure CI really has it.
      - name: Check linters are available
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          if ! err=$(python3 -c "import ament_flake8.main" 2>&1); then
            echo "::error::ament_flake8 import failed: $(echo "$err" | tail -1)"
            exit 1
          fi

      - name: Test
        run: |
          source install/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

      # Job logs need a GitHub login; annotations are public, so surface the
      # failing test output there as well.
      - name: Report test failures
        if: failure()
        run: |
          colcon test-result --verbose 2>&1 | grep -v '^$' | tail -n 4 | while read -r line; do
            echo "::error::$line"
          done
          # One annotation per package with the tail of its test log.
          for f in log/latest_test/*/stdout_stderr.log; do
            [ -s "$f" ] || continue
            pkg=$(basename "$(dirname "$f")")
            echo "::error title=$pkg test log::$(tail -n 25 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
